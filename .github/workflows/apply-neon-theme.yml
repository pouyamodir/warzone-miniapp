name: apply-neon-theme
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble index.html from b64 chunks
        run: |
          python3 << 'PY'
          from pathlib import Path
          import base64
          parts = sorted(Path("_theme_staging").glob("*.b64"))
          assert parts, "no chunks"
          b64 = "".join(p.read_text().strip() for p in parts)
          data = base64.b64decode(b64)
          assert b"STATS_HIDE_IDS" in data
          assert b"lobby-bar" in data
          Path("index.html").write_bytes(data)
          print("wrote index.html", len(data))
          PY
      - name: Commit themed index and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf _theme_staging
          rm -f .github/workflows/apply-neon-theme.yml
          git add index.html
          git add -A
          git status
          git commit -m "UI: neon-glass theme (Concept C) + champagne lobby accents"
          git push origin HEAD:main
