name: patch-index-once
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build xform, restore tip, patch, cleanup
        run: |
          python3 << 'PY'
          import base64, pathlib, urllib.request
          parts = [pathlib.Path(f"_staging/x{i}.b64").read_text().strip() for i in range(7)]
          pathlib.Path("_xform.py").write_bytes(base64.b64decode("".join(parts)))
          url = "https://raw.githubusercontent.com/pouyamodir/warzone-miniapp/3f58c27b2842a2e24dcd4bda49da6095a71e74fb/index.html"
          pathlib.Path("index.html").write_bytes(urllib.request.urlopen(url).read())
          print("restored", pathlib.Path("index.html").stat().st_size)
          PY
          python3 _xform.py
          rm -f _xform.py
          rm -rf _staging
          rm -f .github/workflows/patch-index-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -A _staging .github/workflows || true
          git status
          git commit -m "Multi-lobby list UI with new-request CTA"
          git push origin HEAD:main
