name: Inline miniapp JS
on:
  workflow_dispatch:
jobs:
  inline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inline app.js into index.html and stub app.js
        run: |
          python3 << 'PY'
          from pathlib import Path
          idx = Path('index.html')
          app = Path('app.js')
          html = idx.read_text(encoding='utf-8')
          js = app.read_text(encoding='utf-8')
          if 'src="app.js"' not in html:
              print('already inlined or missing src; skipping replace')
          else:
              html = html.replace('<script src="app.js"></script>', '<script>\n' + js.rstrip('\n') + '\n</script>', 1)
              idx.write_text(html, encoding='utf-8')
              print('inlined', len(html))
          app.write_text('console.warn("app.js unused; logic is in index.html");\n', encoding='utf-8')
          for m in ['clearPlayerStats', 'حذف از آمار', 'STATS_HIDE_IDS = ["6812317446"]', 'STATS_HIDE_USERNAMES = ["pouya_modir"]', 'آمار هم پاک']:
              assert m in idx.read_text(encoding='utf-8'), m
          assert 'src="app.js"' not in idx.read_text(encoding='utf-8')
          print('verified')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js
          git diff --cached --quiet && echo 'no changes' && exit 0
          git commit -m "Inline mini app JS again for single-file hosting"
          git push
