<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Squad</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0c0e; --card: rgba(255,255,255,.035); --stroke: rgba(255,255,255,.08);
      --text: #f3f1ec; --dim: #9a958c; --gold: #d7b369; --gold2: #f0d59a;
      --ok: #8fcaa0; --wait: #e0b86a; --no: #d98980; --shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Vazirmatn", sans-serif; color: var(--text); padding: 18px 16px 28px;
      background: radial-gradient(900px 420px at 100% -10%, rgba(215,179,105,.12), transparent 50%), var(--bg);
    }
    .wrap { max-width: 460px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: flex-end; margin: 6px 0 22px; }
    .brand { font-weight: 700; font-size: 13px; letter-spacing: 2.4px; color: var(--gold); }
    .hello { font-size: 22px; font-weight: 700; line-height: 1.35; margin-top: 4px; }
    .hello span { color: var(--dim); font-weight: 400; font-size: 14px; display: block; }
    .ghost { border: 1px solid var(--stroke); background: transparent; color: var(--text); border-radius: 999px; padding: 8px 12px; font-family: inherit; font-size: 12px; }
    .card { background: var(--card); border: 1px solid var(--stroke); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); }
    .kicker { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
    .count { display: flex; align-items: baseline; gap: 8px; }
    .count b { font-size: 54px; font-weight: 800; letter-spacing: -2px; }
    .count em { font-style: normal; color: var(--dim); font-size: 16px; }
    .status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--gold2); margin-top: 4px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); }
    .meta { margin-top: 14px; color: var(--dim); font-size: 13px; line-height: 1.8; }
    .people { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .person { display: flex; justify-content: space-between; align-items: center; padding: 11px 12px; border-radius: 14px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.05); }
    .person.tap { cursor: pointer; }
    .tiny { border: 1px solid var(--stroke); background: transparent; color: var(--text); border-radius: 999px; padding: 3px 8px; font-family: inherit; font-size: 12px; margin-right: 4px; }
    .cols { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--dim); }
    .person .n { font-weight: 600; font-size: 14px; }
    .tag { font-size: 11px; padding: 4px 8px; border-radius: 999px; }
    .tag.ok { background: rgba(143,202,160,.14); color: var(--ok); }
    .tag.wait { background: rgba(224,184,106,.12); color: var(--wait); }
    .tag.no { background: rgba(217,137,128,.12); color: var(--no); }
    .tag.host { background: rgba(215,179,105,.14); color: var(--gold2); }
    .btn { width: 100%; border: 0; border-radius: 16px; padding: 16px 14px; font-family: inherit; font-weight: 700; font-size: 16px; }
    .btn-gold { background: linear-gradient(180deg, #ecd392, #c9a24e); color: #1a1408; }
    .btn-soft { background: rgba(255,255,255,.06); color: var(--text); border: 1px solid var(--stroke); }
    .btn-rules { margin-top: 10px; background: transparent; color: var(--gold2); border: 1px solid rgba(215,179,105,.35); }
    .stack { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .choice, .opt { border: 1px solid var(--stroke); background: rgba(255,255,255,.03); color: var(--text); border-radius: 14px; padding: 13px 10px; font-family: inherit; font-size: 13px; font-weight: 600; }
    .choice.on, .opt.on { border-color: var(--gold); background: rgba(215,179,105,.1); color: var(--gold2); }
    .choice.full { grid-column: 1 / -1; }
    input[type="time"] { width: 100%; background: rgba(255,255,255,.03); color: var(--text); border: 1px solid var(--stroke); border-radius: 14px; padding: 12px; font-family: inherit; font-size: 16px; }
    .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.62); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
    .sheet.on { display: flex; }
    .sheet .inner { width: min(460px,100%); background: #14161a; border: 1px solid var(--stroke); border-radius: 24px 24px 0 0; padding: 18px 18px 28px; max-height: 86vh; overflow: auto; }
    .sheet h3 { font-size: 18px; margin-bottom: 12px; }
    .sheet ol { color: #d6d1c8; padding-right: 18px; line-height: 2; font-size: 13.5px; }
    .muted { color: var(--dim); font-size: 12px; line-height: 1.8; }
    .empty { text-align: center; padding: 28px 10px 10px; }
    .empty h2 { font-size: 26px; font-weight: 800; margin: 8px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="brand">SQUAD BOARD</div>
        <div class="hello" id="hello">سلام</div>
      </div>
      <button class="ghost" id="meChip">عضو</button>
    </header>
    <section id="viewIdle" class="card empty">
      <div class="kicker">الان درخواستی باز نیست</div>
      <h2>کسی هست<br/>برای بازی؟</h2>
      <p class="muted">یه درخواست بده، ساعت و مدت رو مشخص کن. بقیه همین تابلو را می‌بینند.</p>
      <div class="stack">
        <button class="btn btn-gold" id="btnAsk">کسی هست برای بازی؟</button>
        <button class="btn btn-rules" id="btnRules1">قوانین</button>
        <button class="btn btn-rules" id="btnStats1">آمار مشارکت</button>
        <button class="btn btn-rules" id="btnAdmin1" hidden>ادمین</button>
      </div>
    </section>
    <section id="viewCreate" class="card" hidden>
      <div class="kicker">درخواست جدید</div>
      <h2 style="font-size:22px;margin-bottom:14px">کی و تا کی؟</h2>
      <div class="kicker">شروع</div>
      <div class="choices" style="margin-bottom:12px">
        <button class="choice on" data-start="now">همین الان</button>
        <button class="choice" data-start="clock">ساعت مشخص</button>
      </div>
      <div id="clockWrap" hidden>
        <input type="time" id="clock" />
        <div class="muted" style="margin:6px 0 12px">ساعت به وقت ایران</div>
      </div>
      <div class="kicker">حدود بازی</div>
      <div class="choices">
        <button class="opt on" data-dur="120">۲ ساعت</button>
        <button class="opt" data-dur="150">۲ ساعت و نیم</button>
        <button class="opt" data-dur="180">۳ ساعت</button>
      </div>
      <div class="stack">
        <button class="btn btn-gold" id="btnPublish">ثبت درخواست</button>
        <button class="btn btn-soft" id="btnCancelCreate">برگشت</button>
      </div>
    </section>
    <section id="viewBoard" class="card" hidden>
      <div class="kicker" id="hostLine">درخواست‌کننده</div>
      <div class="count"><b id="num">1</b><em>از ۴ نفر</em></div>
      <div class="status"><span class="dot"></span><span id="phase">در انتظار پر شدن اسکواد</span></div>
      <div class="meta" id="timeLine"></div>
      <div class="people" id="people"></div>
      <div class="stack" id="boardActions"></div>
      <button class="btn btn-rules" id="btnRules2">قوانین</button>
      <button class="btn btn-rules" id="btnStats2">آمار مشارکت</button>
      <button class="btn btn-rules" id="btnAdmin2" hidden>ادمین</button>
    </section>
  </div>
</body>
</html>
